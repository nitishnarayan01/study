services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: study
    # No host port: the database is only reachable by the backend. This avoids clashing with a Postgres already installed on your computer.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Optional: the app starts with safe local defaults if .env is missing
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://study:study@db:5432/study
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
