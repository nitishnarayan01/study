name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: study
          POSTGRES_PASSWORD: study
          POSTGRES_DB: study
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U study -d study" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run API tests
        run: pytest -q
      - name: Migrations and seed work on real Postgres
        env:
          DATABASE_URL: postgresql+psycopg://study:study@localhost:5432/study
        run: |
          alembic upgrade head
          python -m app.seed.seed
          python -m app.seed.seed   # second run must be safe (idempotent)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build

  content:
    # Makes sure lesson source files are valid and content.json was regenerated after edits.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check lesson sources
        run: node content-source/scripts/check.js
      - name: content.json matches the sources
        run: |
          node content-source/scripts/export.js
          git diff --exit-code backend/app/seed/content.json || { echo "::error::content.json is out of date. Run: node content-source/scripts/export.js and commit the result."; exit 1; }
